<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Kamu 💗</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ffd7e8,#ff9fc5,#ffe2ee)}
.decor{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.float{position:absolute;bottom:-60px;animation:fly linear infinite;opacity:.65;user-select:none}
@keyframes fly{to{transform:translateY(-115vh) rotate(30deg);opacity:0}}
.card{position:relative;z-index:2;text-align:center;background:#ffffffa8;backdrop-filter:blur(10px);border:2px solid white;border-radius:28px;padding:34px 25px;box-shadow:0 15px 45px #db4c8b44;width:min(90vw,390px)}
h1{color:#c52c75;font-size:28px;margin:0 0 12px}
p{color:#99516e;line-height:1.5}
button{border:0;border-radius:50px;padding:15px 28px;background:#f34d91;color:white;font-weight:bold;font-size:16px;cursor:pointer;box-shadow:0 6px 15px #ee4c8b66;transition:.2s}
button:hover{transform:scale(1.06);background:#df2e79}
#surprise{display:none;animation:pop .5s ease}
#surprise img{display:block;width:100%;max-width:290px;margin:20px auto;border-radius:15px;box-shadow:0 8px 25px #8d285a55}
@keyframes pop{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="decor" id="decor"></div>
<main class="card">
<div id="intro"><h1>Hai, kamu! 🌷</h1><p>Ada sesuatu yang spesial buat kamu...</p><button id="open">Klik di sini 💌</button></div>
<div id="surprise"><h1>Spesial buat kamu 💖</h1><img src="meme.png" alt="Meme untuk kamu cantik"><p>Hehehe, ini buat kamu 🌹</p><button id="again">Lihat lagi 💗</button></div>
</main>
<script>
const decor=document.getElementById('decor');
const icons=['💗','💕','🌸','🌹','💖','🌷','💐'];
for(let i=0;i<36;i++){
 const el=document.createElement('span');el.className='float';el.textContent=icons[Math.floor(Math.random()*icons.length)];
 el.style.left=Math.random()*100+'%';el.style.fontSize=(17+Math.random()*25)+'px';
 el.style.animationDuration=(7+Math.random()*10)+'s';el.style.animationDelay=(-Math.random()*17)+'s';decor.appendChild(el);
}
document.getElementById('open').onclick=()=>{document.getElementById('intro').style.display='none';document.getElementById('surprise').style.display='block'};
document.getElementById('again').onclick=()=>{document.getElementById('surprise').style.display='none';document.getElementById('intro').style.display='block'};
</script>
</body>
</html>
